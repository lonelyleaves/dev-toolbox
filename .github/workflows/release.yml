name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run compile

      - name: 单元测试
        run: npm test

      - name: 递增版本（本地 commit + tag）
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release %s"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: 构建
        run: npm run build

      - name: 发布到 VS Code Marketplace（Trusted Publishing / OIDC）
        run: npx --yes @vscode/vsce publish --oidc

      - name: 推送版本提交与 tag
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}" --follow-tags

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --title "v${{ steps.bump.outputs.version }}"
