name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run compile

      - name: 单元测试
        run: npm test

      - name: 构建（含 webview）
        run: npm run build

      - name: 打包 vsix
        run: npx vsce package

      - name: 上传 vsix 产物
        uses: actions/upload-artifact@v4
        with:
          name: dev-toolbox-vsix
          path: '*.vsix'
          if-no-files-found: error
